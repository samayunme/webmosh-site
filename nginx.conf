server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # single page: anything unknown falls back to the homepage
    location / {
        include /etc/nginx/security-headers.conf;
        # /about serves about.html, /services/seo serves services/seo.html
        try_files $uri $uri.html $uri/ /index.html;
    }

    # the page is one file and changes on every deploy — never serve a stale copy
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # fingerprinted asset types can be cached forever
    location ~* \.(?:css|js|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # images keep their filenames across deploys (assets/hero.jpg is replaced
    # in place), so a year-long immutable cache would strand returning
    # visitors on the old picture. A week, revalidated, is the honest limit.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        access_log off;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml+rss;

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
