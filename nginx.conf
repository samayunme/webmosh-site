server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # single page: anything unknown falls back to the homepage
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # the page is one file and changes on every deploy — never serve a stale copy
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|webp|avif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        access_log off;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml+rss;

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
