server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location / {
        include /etc/nginx/security-headers.conf;
        # /about serves about.html, /services/seo serves services/seo.html.
        # A miss is a real 404: this is a multi-page site, and falling back to
        # the homepage would answer every wrong URL with 200 and hand search
        # engines a pile of duplicate pages.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # the page is one file and changes on every deploy — never serve a stale copy
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        # a browser asking for /index.html is sent to the site root; the
        # internal rewrite from try_files keeps $request_uri as "/", so it
        # does not match here and cannot loop
        if ($request_uri ~ "^/index\.html($|\?)") { return 301 /; }
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # links no longer carry .html, so send anyone arriving on an old URL to
    # the clean one. Same guard: only an actual browser request redirects,
    # never the internal rewrite that serves the file.
    location ~ ^/(?<clean_path>.+)\.html$ {
        include /etc/nginx/security-headers.conf;
        if ($request_uri ~ "\.html($|\?)") { return 301 /$clean_path; }
    }

    # these filenames are stable across deploys, so they are revalidated
    # rather than cached hard — "immutable" here hid every CSS update
    location ~* \.(?:css|js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }
    location ~* \.woff2?$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # images keep their filenames across deploys (assets/hero.jpg is replaced
    # in place), so a year-long immutable cache would strand returning
    # visitors on the old picture. A week, revalidated, is the honest limit.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        access_log off;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml+rss;

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
