# nginx drops inherited add_header directives in any location that declares
# its own, so every location below includes this file rather than relying
# on the server block.
add_header X-Content-Type-Options  "nosniff"                          always;
add_header X-Frame-Options         "SAMEORIGIN"                       always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

# Google Fonts is the only external origin this page talks to.
#
# script-src is 'self' with no 'unsafe-inline': the pages have no inline
# script, and JSON-LD is application/ld+json, which is data rather than
# something script-src applies to.
#
# style-src keeps 'unsafe-inline' because the pages carry style="" attributes
# throughout. Moving those into site.css is what would let it go.
#
# connect-src is 'self'. When the enquiry form gets a handler on another
# origin — Web3Forms, Formspree — add that origin here or the POST is
# blocked, e.g. connect-src 'self' https://api.web3forms.com
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
