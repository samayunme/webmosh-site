# nginx drops inherited add_header directives in any location that declares
# its own, so every location below includes this file rather than relying
# on the server block.
add_header X-Content-Type-Options  "nosniff"                          always;
add_header X-Frame-Options         "SAMEORIGIN"                       always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

# Google Fonts is the only external origin this page talks to.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'self'" always;
